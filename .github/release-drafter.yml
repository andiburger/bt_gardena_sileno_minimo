name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Hier definieren wir die Kategorien für deine Release Notes
categories:
  - title: '🚀 New Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bugfixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '🧰 Maintenance & CI'
    labels:
      - 'chore'
      - 'ci'
      - 'dependencies'

# So sieht eine einzelne Zeile im Changelog aus
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'

# Automatische Berechnung der nächsten Version (Semantic Versioning)
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
  default: patch

# Das finale Aussehen der Release Notes
template: |
  ## Änderungen in diesem Release
  $CHANGES

  **Vollständiger Changelog**: https://github.com/andiburger/bt_gardena_sileno_minimo/commits/$RESOLVED_VERSION