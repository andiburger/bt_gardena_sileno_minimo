name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  quality-and-testing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies and Python packages
        run: |
          python -m pip install --upgrade pip
          # Installiere alle nötigen Test- und Linting-Tools
          pip install black bandit pylint pytest pytest-asyncio
          # Installiere die Projekt-Dependencies
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 1. Check Code Formatting (Black)
        run: black --check .

      - name: 2. Security Check (Bandit)
        run: bandit -r . -ll -ii

      - name: 3. Linting (Pylint)
        run: pylint --errors-only $(git ls-files '*.py')

      - name: 4. Unit Tests (Pytest)
        run: pytest