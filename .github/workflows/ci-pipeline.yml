name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  quality-and-testing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies and Python packages
        run: |
          python -m pip install --upgrade pip
          pip install black bandit pylint pytest pytest-asyncio pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 1. Check Code Formatting (Black)
        run: black --check .

      - name: 2. Security Check (Bandit)
        run: bandit -r . -ll -ii

      - name: 3. Linting (Pylint)
        run: pylint --errors-only $(git ls-files '*.py')

      - name: 4. Unit Tests & Coverage Report
        # Erzeugt nun die für Codecov notwendige coverage.xml
        run: pytest --cov=. --cov-report=xml

      - name: 5. Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true