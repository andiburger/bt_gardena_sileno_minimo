name: Release Drafter

on:
  push:
    # Aktualisiert den Draft-Release, sobald Code auf main landet
    branches:
      - main
  pull_request:
    # Erlaubt dem Drafter, Labels automatisch zu vergeben
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}