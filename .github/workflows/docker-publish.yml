name: Docker Build & Publish

on:
  # WICHTIG: push auf "main" haben wir entfernt! 
  # Dadurch baut er nicht mehr bei jedem kleinen Code-Update.
  release:
    types: [published]
  workflow_dispatch:       # Für den manuellen "Play-Button"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 1. Immer "latest" auf dem main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # 2. NEU: Fallback 1 - Nutze den Branch-Namen (z.B. bei manuellem Trigger)
            type=ref,event=branch
            # 3. NEU: Fallback 2 - Nutze den exakten Tag-Namen (auch wenn es kein "v1.0.0" ist)
            type=ref,event=tag
            # 4. Saubere semantische Versionierung (v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # --- NEU: CACHING ---
          # Das ist bei linux/arm64 zwingend nötig, da das Kompilieren 
          # von Bluetooth-Headern über QEMU sonst extrem lange dauert.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          # Bricht den Build ab (rot), wenn kritische Fehler gefunden werden
          exit-code: '1'
          # Ignoriert Fehler, für die es aktuell noch gar keinen Patch gibt
          ignore-unfixed: true
          # Wir suchen nur nach den schlimmsten Lücken
          severity: 'CRITICAL,HIGH'
        env:
          # Stellt sicher, dass Trivy dein Image herunterladen darf
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}